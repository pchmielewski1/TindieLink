[env:m5stickc-plus2]
platform = espressif32
board = m5stick-c
framework = arduino
board_build.m5stack_architecture = m5stickc_plus2
board_build.sdkconfig_options =
    CONFIG_ARDUINO_LOOP_STACK_SIZE=16384
    CONFIG_SPIRAM_SUPPORT=y
    CONFIG_SPIRAM_USE_MALLOC=y
monitor_speed = 115200
monitor_filters = direct
monitor_rts = 0
monitor_dtr = 0
upload_speed = 1500000
build_flags =
    -DCORE_DEBUG_LEVEL=1
    -DBOARD_HAS_PSRAM
    -mfix-esp32-psram-cache-issue
    -Iinclude
lib_deps =
    m5stack/M5StickCPlus2@^1.0.0
    bblanchon/ArduinoJson@^7.2.0
    bitbank2/JPEGDEC@^1.8.0
lib_ignore =
    bb_spi_lcd
    DFRobot_GP8XXX
